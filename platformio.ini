; PlatformIO project for Seeed Studio XIAO ESP32-C3
; Building-power monitor: push heartbeat to Gatus.
;
; Notes:
; - Build:  pio run
; - Upload: pio run -t upload      (needs the board's serial port)
; - Monitor: pio device monitor    (115200 baud)

[platformio]
default_envs = seeed_xiao_esp32c3

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3      ; verified: ESP32C3, 160MHz, 4MB flash, 320KB RAM
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; XIAO ESP32-C3 exposes USB CDC (HWCDC). 921600 is safe for the USB-JTAG/serial.
upload_speed = 921600

build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
